<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jisr · English for Municipal Professionals</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'><path d='M2 20 Q20 -4 38 20' fill='none' stroke='%231d1d1f' stroke-width='4'/></svg>">
<link rel="stylesheet" href="assets/app.css"><script src="config.js"></script><script src="data/calendar.js"></script><script src="data/ready.js"></script><script src="assets/core.js"></script></head>
<body><header id="site-header"></header>
<main class="wrap">
  <section class="hero">
    <p class="eyebrow" id="partners"></p>
    <h1>English that works.</h1>
    <p class="ar" style="font-size:1.5rem;margin:0 0 6px">جسر · الإنجليزية لبيئة العمل</p>
    <p class="sub" id="tagline"></p>
  </section>

  <section class="band center" id="today"></section>

  <section class="grid g3" style="margin-top:18px">
    <a class="tile" href="schedule.html"><div class="ico">📘</div><b>Lessons</b><div class="muted">All 64 sessions</div></a>
    <a class="tile" href="speak.html"><div class="ico">🎙</div><b>Speaking Lab</b><div class="muted">Talk and get feedback</div></a>
    <a class="tile" href="me.html"><div class="ico">📈</div><b>My progress</b><div class="muted">Scores and activities</div></a>
  </section>
</main>
<footer class="wrap" id="foot" style="margin-top:40px"></footer>
<script>
(function(){
  const J=JISR,t=J.todayISO(),s=J.sessionByDate(t),nx=J.nextSession(t);
  document.getElementById("partners").textContent=J.C.partnersEn;
  document.getElementById("tagline").textContent=J.C.taglineEn+". Three sessions a week, from 8 November to 4 May.";
  const T=document.getElementById("today");
  if(s) T.innerHTML=`<p class="eyebrow">Today · Session ${s.n}</p><h2>${J.esc(s.themeEn)}</h2><p class="muted">${s.typeEn}</p>
    <div class="row" style="justify-content:center;margin-top:18px"><a class="btn big" href="checkin.html">Check in</a><a class="btn alt big" href="session.html?n=${s.n}">Open lesson</a></div>`;
  else if(nx) T.innerHTML=`<p class="eyebrow">Next session · ${J.fmtDate(nx.date)}</p><h2>${J.esc(nx.themeEn)}</h2><p class="muted">Session ${nx.n} · ${nx.typeEn}</p>
    <div class="row" style="justify-content:center;margin-top:18px"><a class="btn big" href="session.html?n=${nx.n}">Preview the lesson</a></div>`;
  else T.innerHTML=`<h2>The programme is complete. Congratulations! 🎓</h2>`;
  document.getElementById("foot").textContent=`${J.C.partnersEn} · Instructor: ${J.C.instructor}`;
})();
</script></body></html>
