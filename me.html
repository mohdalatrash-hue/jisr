<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jisr · Me</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'><path d='M2 20 Q20 -4 38 20' fill='none' stroke='%231d1d1f' stroke-width='4'/></svg>">
<link rel="stylesheet" href="assets/app.css"><script src="config.js"></script><script src="data/calendar.js"></script><script src="assets/core.js"></script></head>
<body><header id="site-header"></header>
<main class="wrap">
  <section class="hero" style="padding-bottom:16px"><h1 id="hi">My progress.</h1><p class="sub" id="sub"></p></section>
  <section class="grid g3" id="nums"></section>
  <section class="band"><h3>Completed activities</h3><div id="log"></div></section>
  <details class="band no-print"><summary><b>Voice</b> — choose the English voice you hear</summary><div id="voices" style="margin-top:12px"></div></details>
</main>
<script>
(function(){
  const J=JISR,u=J.me(),st=J.stats(),p=J.progress(),held=J.pastSessions().length;
  document.getElementById("hi").textContent=u?`Hi, ${u.name.split(" ")[0]}.`:"My progress.";
  document.getElementById("sub").innerHTML=u?`${J.esc(u.name)} · ${J.esc(u.id)} <a href="#" id="out" style="font-size:.9rem">· not you?</a>`:`You are signed in automatically the first time you <a href="checkin.html">check in</a>.`;
  const out=document.getElementById("out"); if(out) out.onclick=e=>{e.preventDefault();J.setMe(null);location.reload();};
  const tile=(n,l)=>`<div class="card center"><div style="font-size:2.6rem;font-weight:700;letter-spacing:-.03em">${n}</div><div class="muted">${l}</div></div>`;
  document.getElementById("nums").innerHTML=tile(st.done,"activities done")+tile(st.pct+"%","average score")+tile(`${held}/${J.S.length}`,"sessions held");
  const rows=[];Object.entries(p).forEach(([n,a])=>Object.entries(a).forEach(([k,v])=>rows.push([Number(n),k,v])));rows.sort((a,b)=>b[2].ts-a[2].ts);
  document.getElementById("log").innerHTML=rows.length?`<div class="tscroll" style="max-height:none"><table><tr><th>Session</th><th>Activity</th><th>Best</th></tr>${rows.map(r=>`<tr><td><a href="session.html?n=${r[0]}">${r[0]||"Lab"}</a></td><td>${J.esc(r[1].startsWith("open:")?"Opened · "+r[1].split(":").slice(2).join(":"):(r[1].split(":").slice(1).join(":")||r[1]))}</td><td>${r[2].score}/${r[2].max}</td></tr>`).join("")}</table></div>`:'<p class="muted">Nothing yet. Open today\'s lesson.</p>';
  const V=document.getElementById("voices");
  function vv(){const vs=J.voices();if(!vs.length){V.innerHTML='<p class="muted">No English voices in this browser.</p>';return;}const pref=J.LS.get("voices",{});
    V.innerHTML=["A","B"].map(sl=>`<label>${sl==="A"?"Main voice":"Second speaker"}</label><div class="row"><select data-s="${sl}" style="flex:1"><option value="">Automatic (male)</option>${vs.map(v=>`<option ${pref[sl]===v.name?"selected":""}>${J.esc(v.name)}</option>`).join("")}</select><button class="btn alt sm" data-t="${sl}">Test</button></div>`).join("");
    V.querySelectorAll("select").forEach(s=>s.onchange=()=>{const p=J.LS.get("voices",{});p[s.dataset.s]=s.value;J.LS.set("voices",p);});
    V.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>J.speak("Good morning. How can I help you today?",b.dataset.t));}
  vv(); if(window.speechSynthesis) speechSynthesis.addEventListener("voiceschanged",vv);
})();
</script></body></html>
