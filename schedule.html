<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jisr · Schedule</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'><path d='M2 20 Q20 -6 38 20' fill='none' stroke='%23c4553a' stroke-width='4'/></svg>">
<link rel="stylesheet" href="assets/app.css"><script src="config.js"></script><script src="data/calendar.js"></script><script src="data/ready.js"></script><script src="assets/core.js"></script></head>
<body><header id="site-header"></header>
<main class="wrap">
  <section class="hero" style="padding-bottom:14px"><h1>Lessons.</h1><p class="sub" id="sum"></p></section>
  <section class="band" id="thisweek"></section>
  <h2 style="margin-top:30px">All weeks</h2>
  
  <div class="cal" id="cal"></div>
  <h3 style="margin-top:24px">No sessions on these days · أيام بدون جلسات</h3>
  <div id="breaks" class="muted"></div>
</main>
<script>
(function(){
  const J=JISR,t=J.todayISO(),R=window.JISR_READY||[],W={};
  J.S.forEach(s=>(W[s.week]=W[s.week]||[]).push(s));
  document.getElementById("sum").innerHTML=`64 lessons · Sunday, Monday, Tuesday · 8 Nov – 4 May<br><span class="ar">٦٤ درسًا · الأحد والاثنين والثلاثاء</span>`;
  const cw=(J.sessionByDate(t)||J.nextSession(t)||J.S.at(-1)).week,tw=W[cw];
  document.getElementById("thisweek").innerHTML=`<p class="eyebrow">This week · Week ${cw}</p><h2>${J.esc(tw[0].themeEn)}</h2><p class="ar muted" style="margin-top:-6px">${J.esc(tw[0].themeAr)}</p><div class="grid g3" style="margin-top:12px">${tw.map(x=>{const d=J.stepsDone(x.n).size,tot=J.LS.get("stepsTotal."+x.n,9),ok=R.includes(x.n);return `<a class="tile" href="session.html?n=${x.n}" style="background:var(--paper)"><div class="muted" style="font-size:.85rem">${J.fmtDate(x.date)}${x.date===t?" · Today":""}</div><b>Lesson ${x.n} · ${x.typeEn}</b><div class="muted" style="font-size:.85rem;margin-top:4px">${ok?(d>=tot?"✓ Done":d?d+" of "+tot+" steps":"Not started"):"Coming soon"}</div></a>`;}).join("")}</div>`;
  document.getElementById("cal").innerHTML=Object.values(W).map(w=>`<div class="wk"><div><b>Week ${w[0].week}</b><div>${J.esc(w[0].themeEn)}</div><div class="ar muted">${J.esc(w[0].themeAr)}</div></div>
   <div class="sess">${w.map(s=>`<a href="session.html?n=${s.n}" class="${s.date===t?"today":""} ${s.date<t?"past":""} ${R.includes(s.n)?"ready":""}"><b>${J.fmtDate(s.date)}${J.stepsDone(s.n).size>=J.LS.get("stepsTotal."+s.n,9)?" ✓":""}</b><span>Lesson ${s.n} · ${s.typeEn}</span>${s.ramadan?"<small>🌙 Ramadan</small>":""}</a>`).join("")}</div></div>`).join("");
  const B={};(window.JISR_BREAKS||[]).forEach(b=>(B[b.reason]=B[b.reason]||[]).push(J.fmtDate(b.date)));
  document.getElementById("breaks").innerHTML=Object.entries(B).map(([k,v])=>`<p><b>${k}:</b> ${v.join(", ")}</p>`).join("");
})();
</script></body></html>
